name: Docker Build and Push to GHCR

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ production, test ]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to tag for image publish
        required: true
        type: choice
        options:
          - production
          - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name == 'test' }}

jobs:
  docker-build-push:
    # Run on pushes to production/test OR manual trigger
    name: docker / build-and-push
    if: |
      (github.event_name == 'workflow_dispatch' && contains(fromJson('["production", "test"]'), inputs.branch)) ||
      contains(fromJson('["production", "test"]'), github.ref_name)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tag based on target branch
        id: set-tag
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.base_ref=${GITHUB_BASE_REF}"
          echo "github.ref_name=${GITHUB_REF_NAME}"
          echo "inputs.branch=${{ inputs.branch }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_BRANCH="${{ inputs.branch }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            TARGET_BRANCH="${GITHUB_REF_NAME}"
          else
            TARGET_BRANCH="${GITHUB_BASE_REF}"
          fi

          echo "TARGET_BRANCH=$TARGET_BRANCH"

          if [[ "$TARGET_BRANCH" == "production" ]]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=test" >> $GITHUB_OUTPUT
          fi


      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/ninanor/brownbearpopmodel:${{ steps.set-tag.outputs.TAG }}
